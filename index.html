<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>سامانه جامع مشتریان و بازاریابان هدایت گستر</title>
<style>:root{--bg:#f4f6fa;--card:#fff;--solid:#fff;--tx:#131b2c;--mut:#5b6478;--bd:#e4e8f0;--chip:#eef1f6;--pri:#12968f;--pri2:#2f6fed;--acc:#c9a227;--navy:#0f1b2d;--ok:#1e9e6b;--bad:#e5484d;--sh:0 1px 2px #0f1b2d10,0 1px 1px #0f1b2d0a;--sh2:0 6px 16px #0f1b2d14}
:root[data-theme="dark"]{--bg:#0a1220;--card:#101c30;--solid:#101c30;--tx:#eef2f9;--mut:#a7b1c6;--bd:#223350;--chip:#182842;--sh:0 1px 2px #0004;--sh2:0 6px 16px #0006}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1220;--card:#101c30;--solid:#101c30;--tx:#eef2f9;--mut:#a7b1c6;--bd:#223350;--chip:#182842;--sh:0 1px 2px #0004;--sh2:0 6px 16px #0006}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.8 Vazirmatn,Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
h1,h2,h3,p{margin:0}h3{font-size:.98rem;font-weight:700}b{font-weight:600}
.mut{color:var(--mut);font-size:.84rem}.big{font-size:1.6rem;font-weight:800}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* shell */
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#0a1220,#152640);color:#cfd8ea;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}.brand b{color:#fff;display:block;line-height:1.3}.brand small{color:#8b97b3;font-size:.72rem}
.bm{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#d9b94a,#c9a227);color:#0f1b2d;display:grid;place-items:center;font-weight:800;flex-shrink:0}
#menu{display:flex;flex-direction:column;gap:3px;flex:1}
#menu button,.gh{display:flex;gap:12px;align-items:center;background:none;border:0;color:#b7c2dc;padding:10px 12px;border-radius:10px;text-align:right;width:100%}
#menu button:hover,.gh:hover{background:#ffffff10;color:#fff}
#menu button.on{background:#c9a22724;color:#e8cd6f;font-weight:600;box-shadow:inset -3px 0 0 #c9a227}
.sf{border-top:1px solid #ffffff1a;padding-top:12px}.uc{display:flex;gap:10px;align-items:center;padding:4px 6px 10px;color:#fff}.uc small{display:block;color:#8b97b3;font-size:.72rem}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;font-size:.82rem;font-weight:700;flex-shrink:0}
.main{min-width:0}
.tp{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;padding:12px 24px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.tp h1{flex:1;font-size:1.15rem;font-weight:700}
.ib{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;color:var(--tx)}
.ib.mt{display:none}
.bd{position:absolute;top:-6px;left:-6px;background:var(--bad);color:#fff;border-radius:99px;font-size:.66rem;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
main{padding:24px;max-width:1180px;margin:0 auto}
.bk{display:none}
/* cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:var(--sh);min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.card+.card,.grid+.card,.card+.grid,.hero+*,.tip+*{margin-top:0}
.chh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}.chh h3{margin:0}
.hero{border-radius:16px;padding:22px 24px;color:#fff;background:radial-gradient(circle at 15% 20%,#1c3253,#0a1220 75%);margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:1px solid #c9a22744}
.hero h2{font-size:1.3rem;font-weight:800}.hero p{color:#b8c1d6;margin-top:4px}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.pill{background:#ffffff14;border-radius:10px;padding:6px 14px;font-size:.82rem;color:#cfd8ea}.pill b{display:block;color:#fff;font-size:1rem}
.kpi{position:relative}.kh{display:flex;justify-content:space-between;align-items:center}
.ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.kv{font-size:1.7rem;font-weight:800;line-height:1.4;margin-top:8px}.kv small{font-size:.78rem;color:var(--mut);font-weight:400;margin-right:6px}
.kl{color:var(--mut);font-size:.84rem}
.dl{font-size:.74rem;font-weight:700}.dl.up{color:var(--ok)}.dl.dn{color:var(--bad)}
.spark{width:100%;height:30px;margin-top:8px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--chip);border-right:3px solid var(--acc);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.85rem}
.tip span{display:none}.tip b{display:block}
/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{color:var(--mut);font-weight:600;text-align:right;padding:8px 12px;white-space:nowrap;font-size:.78rem;border-bottom:1px solid var(--bd)}
td{padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--bd)}tr:last-child td{border-bottom:0}
tr:hover td{background:var(--chip)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;font-size:.74rem;font-weight:600;white-space:nowrap}
.L-new{background:#5b8def}.L-A{background:#3b82c4}.L-B{background:#0e9aa7}.L-C{background:#7a3fb2}.L-loyal{background:#c9a227}.L-idle{background:#8a93a8}
.bar{height:8px;background:var(--chip);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--pri),var(--acc))}
/* forms */
label{display:block;font-size:.8rem;font-weight:600;color:var(--mut);margin:10px 0 5px}
input,select{width:100%;background:var(--chip);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;outline:none}
input:focus,select:focus{border-color:var(--pri2);background:var(--card)}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 20px;font-weight:600;margin-top:12px}
.btn:hover{filter:brightness(1.08)}.btn-block{width:100%}
.sm{padding:5px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);font-size:.8rem;margin-left:4px}.sm.d{color:var(--bad)}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tb input,.tb select{width:auto;flex:1;min-width:140px}.tb .btn{margin:0}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.fl button{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px 14px;font-size:.82rem}.fl button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.rt{display:flex;background:var(--chip);border-radius:9px;padding:3px}.rt button{border:0;background:none;padding:3px 12px;border-radius:7px;font-size:.78rem;color:var(--mut)}.rt button.on{background:var(--card);color:var(--tx);font-weight:700}
.inv{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin-bottom:8px}
.sum{background:var(--navy);color:#fff;border-radius:12px;padding:14px;margin-top:12px}.sum b{font-size:1.2rem}
/* charts */
.cw{width:100%;position:relative}.cw svg{display:block;max-width:100%}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.76rem;color:var(--mut);margin-top:6px}.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-left:5px}
.dn{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}.dn svg{width:150px;height:150px}.dn .lg{flex-direction:column;margin:0;font-size:.82rem}
/* roadmap, feed, alerts */
.rm{display:flex;align-items:flex-start;overflow-x:auto;padding:12px 4px}
.rn{text-align:center;min-width:74px;opacity:.55}.rn b{display:block;font-size:.8rem}.rn small{color:var(--mut);font-size:.7rem}
.rc{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:700;background:var(--chip);border:2px solid var(--bd)}
.rn.done{opacity:1}.rn.done .rc{background:#d7f2f0;color:var(--pri);border-color:var(--pri)}
.rn.cur{opacity:1}.rn.cur .rc{background:linear-gradient(135deg,#d9b94a,#c9a227);color:#0f1b2d;border-color:#c9a227;box-shadow:0 8px 20px #c9a22740;transform:scale(1.1)}
.rl{flex:1;min-width:16px;height:3px;background:var(--bd);margin-top:22px;border-radius:3px}.rl.done{background:var(--pri)}
.fi{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.fi:last-child{border:0}.fi .ic{width:36px;height:36px}.fi b{display:block;font-size:.88rem}.fi small{color:var(--mut)}
.al{padding:10px 12px;border-radius:10px;background:var(--chip);margin:8px 0;font-size:.85rem;border-right:3px solid var(--acc)}.al span{display:none}
.empty{text-align:center;padding:26px;color:var(--mut)}
/* settings & help */
.sec{padding:0;overflow:hidden;margin-bottom:14px}.sh{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bd)}
.sh .n{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#0f1b2d;display:grid;place-items:center;font-weight:800;flex-shrink:0}.sh h3{margin:0}.sh small{display:block;color:var(--mut);font-weight:400}
.sb{padding:16px 18px}.what{background:var(--chip);border-radius:10px;padding:10px 14px;font-size:.84rem;margin-bottom:14px;line-height:1.9}.what b{color:var(--pri)}
.fld label{margin-top:0;color:var(--tx)}.fld .u{position:relative}.fld .u input{padding-left:66px}.fld .u span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:.76rem}.fld small{display:block;color:var(--mut);margin-top:4px;font-size:.76rem}
.zb{display:flex;border-radius:10px;overflow:hidden;margin-bottom:12px}.zb div{flex:1;color:#fff;text-align:center;padding:8px 2px;font-size:.74rem}.zb b{display:block}
.zr{display:grid;grid-template-columns:84px repeat(3,1fr);gap:10px;align-items:end;padding:12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:10px}.zr .tag{align-self:center;text-align:center}.zr .zs{grid-column:1/-1;font-size:.8rem;color:var(--mut);border-top:1px dashed var(--bd);padding-top:8px}.zr input[readonly]{opacity:.6}
.rr{display:grid;grid-template-columns:1.2fr 1fr 2fr;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px}
.sv{position:sticky;bottom:12px;z-index:15;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh2)}.sv .btn{margin:0}.sv span{flex:1;font-size:.8rem;color:var(--mut)}
details.hp{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px}details.hp summary{cursor:pointer;padding:13px 18px;font-weight:700;list-style:none}
details.hp summary::after{content:"▾";float:left;color:var(--mut)}details.hp[open] summary::after{content:"▴"}
.hb{padding:0 18px 16px;line-height:2}
.ht{margin:8px 0;font-size:.82rem}.ht th,.ht td{border:1px solid var(--bd);padding:6px 10px;white-space:normal}.ht th{background:var(--chip);color:var(--tx)}.ht tr:hover td{background:none}
.fm{background:var(--chip);border-right:3px solid var(--acc);border-radius:8px;padding:8px 14px;margin:8px 0;font-weight:600}
/* overlays */
.mo{position:fixed;inset:0;background:#0009;z-index:50;display:grid;place-items:center;padding:14px;overflow:auto}.mo>.card{width:min(560px,100%);max-height:92vh;overflow:auto}
.np{position:fixed;top:64px;left:16px;width:min(340px,calc(100% - 32px));z-index:40;box-shadow:var(--sh2)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 20px;border-radius:99px;box-shadow:var(--sh2);z-index:60;font-size:.85rem;max-width:calc(100% - 24px);text-align:center}
/* login */
.login-shell{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg)}
.login-visual{background:radial-gradient(circle at 20% 20%,#1c3253,#0a1220 70%);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:48px;color:#fff}
.login-visual>*{position:relative;z-index:2}.login-visual .orbit-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;opacity:.9}
.brand-row{display:flex;align-items:center;gap:12px;font-weight:700}
.visual-copy{max-width:420px}.visual-copy h2{font-size:1.75rem;font-weight:800;line-height:1.6}.visual-copy p{margin-top:12px;color:#b8c1d6;line-height:1.9}
.visual-foot{font-size:.72rem;color:#7d89a3}
.login-panel{display:flex;align-items:center;justify-content:center;padding:40px;position:relative}
.login-form-card{width:100%;max-width:380px}.login-form-card h1{font-size:1.3rem;font-weight:800}.lead{font-size:.82rem;color:var(--mut);margin:6px 0 24px}
.login-error{display:none;background:#fbdfe0;color:#c0292e;padding:10px 14px;border-radius:8px;font-size:.8rem;margin-bottom:14px}.login-error.show{display:block}
.demo-accounts{margin-top:22px;border:1px dashed var(--bd);border-radius:14px;padding:12px;font-size:.78rem}.demo-title{font-weight:700;margin-bottom:6px}
.demo-account-row{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer}.demo-account-row:hover{background:var(--chip)}
.cred{font-family:monospace;color:var(--mut);direction:ltr}
.lt{position:absolute;top:16px;left:16px}
/* responsive */
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 aside{position:fixed;top:0;right:0;width:280px;z-index:45;transform:translateX(100%);transition:transform .25s;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
 .op aside{transform:none}.op .bk{display:block;position:fixed;inset:0;background:#0007;z-index:44}
 .ib.mt{display:grid}.tp{padding-left:14px;padding-right:14px}main{padding:14px 12px calc(24px + env(safe-area-inset-bottom,0px))}
 .login-shell{grid-template-columns:1fr}.login-visual{display:none}.login-panel{padding:24px 18px;align-items:flex-start;padding-top:70px}
 .rr{grid-template-columns:1fr}.zr{grid-template-columns:1fr 1fr}.zr .tag{grid-column:1/-1}
}
@media(max-width:720px){
 .grid{grid-template-columns:1fr 1fr}.kv{font-size:1.35rem}.hero{padding:16px}.hero h2{font-size:1.1rem}.card{padding:14px}
 table.rs tr:first-child{display:none}table.rs,table.rs tbody,table.rs tr,table.rs td{display:block;width:100%}
 table.rs tr{border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;padding:4px 12px}
 table.rs td{display:flex;justify-content:space-between;gap:10px;border:0;padding:5px 0;white-space:normal;text-align:left}
 table.rs td::before{content:attr(data-l);color:var(--mut);font-size:.76rem;text-align:right}
 table.rs tr:hover td{background:none}.tw{overflow:visible}
 .tb input,.tb select{min-width:100%}.inv{grid-template-columns:1fr 90px auto}
}
@media(max-width:440px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s),fa=n=>Number(n).toLocaleString("fa-IR",{maximumFractionDigits:1});
const MN=["مهر","آبان","آذر","دی","بهمن","اسفند"],CUR=5;
const NM={new:"جدید",A:"A ضعیف",B:"B متوسط",C:"C قوی",loyal:"وفادار",idle:"راکد"};
const COL={new:"#5b8def",A:"#3b82c4",B:"#0e9aa7",C:"#7a3fb2",loyal:"#c9a227",idle:"#8a93a8"};
const DB={S:{A:30,B:80,hi:2.33,lo:1.67,idleM:6,loyalM:6,kw:4,
tol:40,kcap:150,zones:[[0,50,5],[50,100,13],[100,200,25],[200,400,45],[400,1e5,75]],
ranks:[["بدون رتبه",0,""],["برنزی",100,""],["نقره‌ای",250,""],["طلایی",450,""],["الماس",800,""]]},
prod:[{id:1,n:"لامپ ۶۰ وات",p:20},{id:2,n:"کابل ۲×۱٫۵",p:1500},{id:3,n:"کلید و پریز",p:350},{id:4,n:"چراغ پنل",p:900},{id:5,n:"ترانس ۱۲ ولت",p:4000}],
mk:[{id:0,n:"علی رضایی",u:"ali",L:6},{id:1,n:"سارا احمدی",u:"sara",L:2},{id:2,n:"رضا کریمی",u:"reza",L:7},{id:3,n:"مینا صادقی",u:"mina",L:2},{id:4,n:"حسین نوری",u:"hosein",L:5}],
cust:[],sales:[],plans:[{id:1,w:"همه",it:"همه کالاها",f:20,t:100,pct:7},{id:2,w:"همه",it:"همه کالاها",f:150,t:300,pct:20}],nid:1};
(function seed(){const C=[["لامپ نور اصفهان",0,[40,45,38]],["فروشگاه برق آریا",0,[160,95,20]],["تجهیزات پارس",1,[170,160,155,150,165,158]],["الکتریک مهر",1,[]],["روشنایی نیک",2,[90,70,100]],["برق ستاره",3,[200]],["نورپردازان",4,[35,40,28,45,30]],["کالای برق شرق",2,[160,155,10]],["نور و برق آسیا",3,[180,175,190,170,185,200]],["پخش نور جنوب",4,[60,65,70,40,80,75]]];
C.forEach((c,i)=>{DB.cust.push({id:i,n:c[0],m:c[1],ph:"۰۹۱۳۱۲۳"+(4000+i*7),old:!c[2].length});
 c[2].forEach((t,j)=>{const mo=CUR-j,L=DB.mk[c[1]].L,it=[];for(let k=0;k<L;k++){const p=DB.prod[(k+i)%5];it.push({p:p.id,q:Math.max(1,Math.round(t/L*1000/p.p))})}DB.sales.push({id:DB.nid++,c:i,mo,it,disc:0})})})})();
const P=id=>DB.prod.find(p=>p.id==id),CU=id=>DB.cust.find(c=>c.id==id),MK=id=>DB.mk.find(m=>m.id==id);
const stot=s=>s.it.reduce((a,x)=>a+x.q*P(x.p).p/1000,0);
const hist=c=>{const h=[0,0,0,0,0,0];DB.sales.filter(s=>s.c==c.id).forEach(s=>h[CUR-s.mo]+=stot(s));return h};
const lv=v=>v<=0?0:v<DB.S.A?1:v<DB.S.B?2:3;
function level(c){const S=DB.S,h=hist(c);if(!h.some(x=>x>0))return c.old?"idle":"new";
 const last=h.findIndex(x=>x>0);if(last>=S.idleM)return"idle";
 const first=h.map((x,i)=>x>0?i:-1).reduce((a,b)=>Math.max(a,b)),age=first+1;
 if(age<3)return"new";
 if(age>=S.loyalM&&h.slice(0,S.loyalM).every(x=>lv(x)===3))return"loyal";
 const a=h.slice(0,3).map(x=>Math.max(1,lv(x))).reduce((x,y)=>x+y,0)/3;return a>=S.hi?"C":a<=S.lo?"A":"B"}
const tag=c=>{const k=level(c);return `<span class="tag L-${k}">${NM[k]}</span>`};
const L=DB.S;
const msales=m=>{const a=[0,0,0,0,0,0];DB.sales.forEach(s=>{if(CU(s.c).m==m.id)a[s.mo]+=stot(s)});return a};

 const G=[["فروش ماهانه","جمع مبلغ فاکتورهای یک ماه (میلیون تومان)","جمع فاکتورها","مشتری و بازاریاب"],["مشتری فعال","مشتری غیرراکد","—","داشبورد"],["نرخ مشتریان قوی و وفادار","درصد مشتریان با سطح C یا وفادار","(C+وفادار) ÷ همه مشتریان","داشبورد"],["میانگین ارزش هر قلم","هر ردیف کالا یک قلم است","جمع مبلغ ÷ تعداد اقلام","KPI فاکتور"],["امتیاز ثبات","جمع امتیاز زون ماه‌های دارای ثبات","Σ امتیاز زون هر ماهِ در محدوده","امتیاز کل"],["امتیاز KPI فاکتور","کیفیت فاکتورزنی",`min(${fa(cap)}, میانگین قلم × ${fa(S.kw)})`,"امتیاز کل"],["امتیاز کل","پایه تعیین رتبه","ثبات + KPI","رتبه‌بندی"],["زون","جایگاه فروش ماهانه بازاریاب","بر اساس جدول زون‌ها","پنل بازاریاب"],["رتبه","بالاترین رتبه با حداقل امتیاز کمتر یا مساوی امتیاز کل","جدول رتبه‌ها","رتبه‌بندی"],["تعداد فاکتور","فاکتورهای ثبت‌شده","شمارش","نمودار عملکرد"]];
 return `<div class="hero"><h2>مرکز راهنما</h2><p>تعریف دقیق هر بخش و هر KPI، همراه با مثال با اعداد واقعی همین سامانه</p></div>`+
 hp("start","","شروع سریع و نقش‌ها",`<p><b>مدیر</b> سطح‌ها، زون‌ها، رتبه‌ها و طرح‌های تخفیف را تنظیم می‌کند و همه مشتریان و بازاریابان را می‌بیند.</p><p><b>بازاریاب</b> مشتریان خودش را می‌بیند، فاکتور ثبت می‌کند و رتبه و زونش را دنبال می‌کند.</p><p>مسیر کار: ۱) ثبت مشتری ← ۲) ثبت فاکتور ← ۳) سطح مشتری و امتیاز بازاریاب خودکار به‌روز می‌شود.</p>`)+
 hp("levels","","سطح مشتریان (جدید، A، B، C، وفادار، راکد)",`<table class="ht"><tr><th>سطح</th><th>تعریف با تنظیمات فعلی</th></tr><tr><td>جدید</td><td>کمتر از ۳ ماه از اولین خرید گذشته و هنوز در ارزیابی است</td></tr><tr><td>A ضعیف</td><td>فروش ماهانه کمتر از ${fa(S.A)} م.ت</td></tr><tr><td>B متوسط</td><td>${fa(S.A)} تا کمتر از ${fa(S.B)} م.ت</td></tr><tr><td>C قوی</td><td>${fa(S.B)} م.ت و بیشتر</td></tr><tr><td>وفادار</td><td>${fa(S.loyalM)} ماه پیاپی در سطح C (آخرین مرحله)</td></tr><tr><td>راکد</td><td>${fa(S.idleM)} ماه بدون خرید</td></tr></table>`)+
 hp("new","🆕","مسیر مشتری جدید (ارزیابی ۳ ماهه)",`<p>اولین خرید یکی از سطح‌های A تا C را می‌دهد. پس از ۳ ماه، میانگین سه ماه سطح نهایی را تعیین می‌کند (A=۱، B=۲، C=۳):</p><table class="ht"><tr><th>الگوی ۳ ماه</th><th>میانگین</th><th>نتیجه</th></tr>${exRows()}</table><p class="mut">قانون: میانگین ≥ ${fa(S.hi)} → C؛ ≤ ${fa(S.lo)} → A؛ در غیر این‌صورت B.</p>`)+
 hp("zone","","زون و امتیاز ثبات",`<p>زون یعنی جایگاه فروش ماهانه بازاریاب. امتیاز ثبات ماه، فقط وقتی داده می‌شود که فروش آن ماه از میانگین ۶ ماه بیش از ${fa(S.tol||40)}٪ فاصله نداشته باشد.</p><table class="ht"><tr><th>زون</th><th>فروش ماهانه (م.ت)</th><th>امتیاز هر ماه ثبات</th></tr>${S.zones.map((z,i)=>`<tr><td>زون ${fa(i+1)}</td><td>${rng(z[0],z[1])}</td><td>${fa(z[2])}</td></tr>`).join("")}</table><p><b>مثال واقعی: ${m.n}</b> (میانگین ۶ ماه: ${fa(Math.round(av))} م.ت)</p><table class="ht"><tr><th>ماه</th><th>فروش</th><th>زون</th><th>ثبات</th><th>امتیاز</th></tr>${mrows}</table><div class="fm">امتیاز ثبات = ${fa(stab(m))}</div>`)+
 hp("kpi","","KPI کیفیت فاکتور و شاخص‌ها",`<p>هر ردیف کالا در فاکتور یک «قلم» است. فاکتور با تعداد قلم کمتر و ارزش هر قلم بیشتر، یعنی فروش متمرکز‌تر، امتیاز بیشتری می‌گیرد.</p><div class="fm">امتیاز KPI = min( ${fa(cap)} ، میانگین ارزش هر قلم × ${fa(S.kw)} )</div><p><b>مثال واقعی: ${m.n}</b> — میانگین ارزش هر قلم <b>${fa(Math.round(al*10)/10)} م.ت</b> ← امتیاز KPI = <b>${fa(kpi(m))}</b></p><p><b>واژه‌نامه همه شاخص‌ها:</b></p><table class="ht"><tr><th>شاخص</th><th>تعریف</th><th>فرمول</th><th>کاربرد</th></tr>${G.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table>`)+
 hp("rank","","امتیاز کل و رتبه‌ها",`<div class="fm">امتیاز کل = امتیاز ثبات + امتیاز KPI</div><table class="ht"><tr><th>رتبه</th><th>حداقل امتیاز کل</th></tr>${S.ranks.map(r=>`<tr><td>${r[2]} ${r[0]}</td><td>${fa(r[1])}</td></tr>`).join("")}</table><p><b>مثال:</b> ${m.n} با ثبات ${fa(stab(m))} و KPI ${fa(kpi(m))} امتیاز کل ${fa(total(m))} دارد و در رتبه «${S.ranks[rank(m)][0]}» است.</p>`)+
 hp("plan","","طرح‌های تخفیف",`<p>هر طرح: بازاریاب (یا همه) + کالا (یا همه کالاها) + بازه فروش ماهانه + درصد. هنگام ثبت فاکتور، فروش این ماه بازاریاب با مبلغ فاکتور جمع می‌شود و بالاترین درصدِ طرح منطبق نمایش داده می‌شود.</p><table class="ht"><tr><th>طرح</th><th>بازه (م.ت)</th><th>تخفیف</th></tr>${DB.plans.map(p=>`<tr><td>${p.w} / ${p.it}</td><td>${fa(p.f)} تا ${fa(p.t)}</td><td>${fa(p.pct)}٪</td></tr>`).join("")}</table>`)+
 hp("inv","","ثبت فاکتور",`<p>مشتری و ماه را انتخاب کنید، اقلام را اضافه کنید و ثبت را بزنید. جمع مبلغ، میانگین هر قلم و تخفیف مجاز پیش از ثبت نمایش داده می‌شود. پس از ثبت، سطح مشتری و امتیازها فوراً بازمحاسبه می‌شوند.</p>`)+
 (isM()?hp("set","⚙","تنظیمات مدیر",`<p>صفحه «تنظیمات» ۷ بخش دارد و هر بخش توضیح می‌دهد چه چیزی را تنظیم می‌کنید و اثرش کجاست. پس از ذخیره، همه چیز بازمحاسبه می‌شود؛ «بازگشت به پیش‌فرض» همه را به مقدار اولیه برمی‌گرداند.</p>`):"")+
 hp("faq","❓","سؤالات متداول",`<p><b>چرا مشتری من «جدید» است؟</b> هنوز ۳ ماه از اولین خریدش نگذشته.</p><p><b>چرا امتیاز ثبات ندارم؟</b> فروش آن ماه‌ها از میانگین ۶ ماه‌ات بیش از حد مجاز فاصله داشته یا خرید ثبت نشده.</p><p><b>چطور KPI را بالا ببرم؟</b> فاکتور را با قلم‌های کمتر و ارزش هر قلم بیشتر ثبت کن.</p>`)};
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b){hsec=b.dataset.hs?HS[b.dataset.hs]||"":"";tab=b.dataset.go;shell();scrollTo(0,0)}});
document.addEventListener("input",e=>{const c=[...e.target.classList].find(x=>/^z-\d+-[012]$/.test(x));if(!c)return;const[,i,k]=c.split("-").map(Number);if(k===1){const n=document.querySelector(".z-"+(i+1)+"-0");if(n)n.value=e.target.value}[i,i+1].forEach(j=>{const z=document.getElementById("zs-"+j);if(z)z.textContent=zs(j)})});
document.addEventListener("click",e=>{if(e.target.id==="rst"){confirmBox("بازگشت به پیش‌فرض؟","همه تنظیمات سطح‌ها، زون‌ها، رتبه‌ها و KPI به مقدار اولیه برمی‌گردد.","بازگشت به پیش‌فرض","نگه داشتن",()=>{Object.assign(DB.S,JSON.parse(DEF));shell();toast("تنظیمات به پیش‌فرض برگشت ✓")})}});

login();
</script>
